<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Example</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        background: linear-gradient(to bottom, #919191 0%, #f2f2f2 75%);
        background-repeat: no-repeat;
        background-size: cover;
        height: 100%;
      }

      .cabinet {
        background-color: #202020;
        width: 250px;
        height: 400px;
        padding: 10px;
        margin: 80px auto;
        border-radius: 3px;
      }

      .drawer {
        position: relative;
        width: 100%;
        height: 50%;
        border: 2px solid #000000;
        margin: 0 auto;
        background: linear-gradient(135deg, #828282 0%, #202020 40%);
        background-size: 100%;
        transition: all 1s;
        box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        z-index: 1;

        &:hover {
          background-size: 200%;
          transform: scale(1.15);
          z-index: 2;
          box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.7);

          .files {
            display: block;
            height: 25px;
            top: -27px;
          }
        }
      }

      .wrapper {
        margin: 0 auto;
        top: 50%;
        transform: translatey(-50%);
        position: relative;
        width: 60px;
      }

      label {
        display: block;
        width: 75%;
        height: 30px;
        border: 2px solid #dddddd;
        margin-bottom: 30px;
        box-shadow: inset 0px 0px 5px rgba(0, 0, 0, 1);
        margin: 0 auto 30px auto;
      }

      .handle {
        display: block;
        position: relative;
        background: linear-gradient(to bottom, #dddddd 0%, #5e5e5e 100%);
        width: 100%;
        height: 7px;
        box-shadow: 0px 0px 5px rgba(0, 0, 0, 1);
      }

      .files {
        position: absolute;
        background-color: beige;
        width: 95%;
        height: 0;
        left: 0;
        right: 0;
        top: -2px;
        margin: auto;
        box-shadow: -2px -2px 5px rgba(0, 0, 0, 0.2);
        transition: all 1s;

        &:before,
        &:after {
          position: absolute;
          top: -10px;
          height: 10px;
          width: 50%;
          box-shadow: -1px -2px 5px rgba(0, 0, 0, 0.2);
          border-top-left-radius: 5px;
          border-top-right-radius: 5px;
        }

        &:before {
          content: '';
          background-color: beige;
          left: 0;
        }

        &:after {
          content: '';
          background-color: darken(beige, 10%);
          right: 0;
        }
      }
    </style>

  </head>

  <body>
    <main>
      <p>This is from the codepen "Skeumorphism: Filing Cabinet by Dimitris Kotsakis available here: https://codepen.io/dkLtd/pen/JjjNNam</p>
      <div class="cabinet">
        <div class="drawer">
          <div class="wrapper">
            <label></label>
            <div class="handle"></div>
          </div>
          <div class="files"></div>
        </div>
        <div class="drawer">
          <div class="wrapper">
            <label></label>
            <div class="handle"></div>
          </div>
          <div class="files"></div>
        </div>
      </div>
    </main>
  </body>

</html>
