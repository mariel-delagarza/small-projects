<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotate and Merge Charts</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 200px);
        gap: 1rem;
        position: relative;
        transition: gap 0.8s ease-in-out;
      }

      .grid.tight {
        gap: 0;
      }

      .chart {
        width: 200px;
        height: 200px;
        background: #444;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        transition: transform 0.8s ease-in-out;
        transform-origin: center;
        position: relative;
        z-index: 2;

      }

      .rotate .chart {
        transform: rotate(90deg);
      }

      #big-chart {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        border: 2px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-in-out, visibility 0s linear 0.2s;
        z-index: 1;
      }

      #big-chart.show {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        transition: opacity 0.5s ease-in-out;
        z-index: 2;
      }

      button {
        margin-top: 2rem;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>

  <body>

    <div class="grid" id="chartGrid">
      <div class="chart" id="chart1">Chart 1</div>
      <div class="chart" id="chart2">Chart 2</div>
      <div class="chart" id="chart3">Chart 3</div>
      <div class="chart" id="chart4">Chart 4</div>

      <div id="big-chart">Big Chart</div>
    </div>

    <button id="rotateBtn">Rotate + Merge</button>

    <script>
      const grid = document.getElementById('chartGrid');
      const btn = document.getElementById('rotateBtn');
      const bigChart = document.getElementById('big-chart');

      let rotated = false;

      btn.addEventListener('click', () => {
        rotated = !rotated;

        grid.classList.toggle('rotate', rotated);
        grid.classList.toggle('tight', rotated);

        btn.textContent = rotated ? 'Undo Merge' : 'Rotate + Merge';

        if (rotated) {
          // Delay fade-in until right before the rotation ends
          setTimeout(() => {
            bigChart.classList.add('show');
          }, 650); // slightly before rotation finishes
        } else {
          // Instantly hide on reset
          bigChart.classList.remove('show');
        }
      });
    </script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/series-label.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script src="https://code.highcharts.com/themes/adaptive.js"></script>
    <script src="chart1.js"></script>
    <script src="chart2.js"></script>
    <script src="chart3.js"></script>
    <script src="chart4.js"></script>
    <script src="bigchart.js"></script>

  </body>

</html>
