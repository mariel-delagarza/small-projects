<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotate and Merge Charts</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 200px);
        gap: 1rem;
        /* initial spacing between charts */
        transition: gap 0.8s ease-in-out;
      }

      .grid.tight {
        gap: 0;
        /* remove spacing to merge into big chart */
      }

      .chart {
        width: 200px;
        height: 200px;
        background: #444;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        transition: transform 0.8s ease-in-out;
        transform-origin: center;
      }

      .rotate .chart {
        transform: rotate(90deg);
      }

      button {
        margin-top: 2rem;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>

  <body>

    <div class="grid" id="chartGrid">
      <div class="chart" id="chart1">Chart 1</div>
      <div class="chart" id="chart2">Chart 2</div>
      <div class="chart" id="chart3">Chart 3</div>
      <div class="chart" id="chart4">Chart 4</div>
    </div>

    <button id="rotateBtn">Rotate + Merge</button>

    <script>
      const grid = document.getElementById('chartGrid');
      const btn = document.getElementById('rotateBtn');

      let rotated = false;

      btn.addEventListener('click', () => {
        rotated = !rotated;

        grid.classList.toggle('rotate', rotated);
        grid.classList.toggle('tight', rotated);

        btn.textContent = rotated ? 'Undo Merge' : 'Rotate + Merge';
      });
    </script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/series-label.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script src="https://code.highcharts.com/themes/adaptive.js"></script>
    <script src="chart1.js"></script>
    <script src="chart2.js"></script>
    <script src="chart3.js"></script>
    <script src="chart4.js"></script>

  </body>

</html>
